name: Terraform

on:
  push:
    branches: [main, master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/terraform
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Generate tfvars
        run: |
          cat > $TF_DIR/environments/$ENVIRONMENT.tfvars << 'EOF'
          environment      = "$ENVIRONMENT"
          db_instance_class = "db.t3.micro"
          ecs_cpu           = 256
          ecs_memory        = 512
          ecs_desired_count = 1
          jwt_secret        = "$JWT_SECRET"
          cloudinary_cloud_name = ""
          cloudinary_api_key    = ""
          cloudinary_api_secret = ""
          anthropic_api_key = ""
          apify_api_key     = ""
          domain_name       = ""
          EOF
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Terraform Init
        run: terraform init -backend-config=environments/backend-${ENVIRONMENT}.hcl -reconfigure
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=environments/${ENVIRONMENT}.tfvars -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_DIR }}/tfplan

  apply:
    name: Terraform Apply
    needs: plan
    if: github.ref_name == 'master' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config=environments/backend-${ENVIRONMENT}.hcl -reconfigure
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: ${{ env.TF_DIR }}
