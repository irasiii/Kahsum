name: Deploy Static Sites

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-flutter-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Flutter platforms exist
        run: |
          flutter config --enable-web
          flutter create --platforms=web,android .

      - name: Patch Android Gradle Kotlin DSL SDK values
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter\.compileSdkVersion/35/g' android/app/build.gradle.kts
            sed -i 's/flutter\.minSdkVersion/21/g' android/app/build.gradle.kts
            sed -i 's/flutter\.targetSdkVersion/35/g' android/app/build.gradle.kts
            echo "Patched android/app/build.gradle.kts"
            echo "-----"
            grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle.kts || true
            echo "-----"
          else
            echo "android/app/build.gradle.kts not found, skipping patch"
          fi

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: apps/flutter_app/build/web

  deploy:
    name: Deploy to S3/CloudFront
    runs-on: ubuntu-latest
    needs:
      - build-flutter-web
    if: ${{ always() && needs.build-flutter-web.result == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Flutter web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync deploy/ s3://khasm-${ENVIRONMENT:-staging}-flutter-web --delete

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, 'khasm-${ENVIRONMENT:-staging}-flutter-web')].Id" --output text)
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi
