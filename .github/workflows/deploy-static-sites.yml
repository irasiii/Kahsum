name: Deploy Static Sites

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-flutter-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Flutter platforms exist
        run: |
          flutter config --enable-web
          flutter create --platforms=web,android .

      - name: Patch Android Gradle Kotlin DSL SDK values
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter\.compileSdkVersion/35/g' android/app/build.gradle.kts
            sed -i 's/flutter\.minSdkVersion/21/g' android/app/build.gradle.kts
            sed -i 's/flutter\.targetSdkVersion/35/g' android/app/build.gradle.kts
            echo "Patched android/app/build.gradle.kts"
            echo "-----"
            grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle.kts || true
            echo "-----"
          else
            echo "android/app/build.gradle.kts not found, skipping patch"
          fi

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: apps/flutter_app/build/web

  build-root-web:
    name: Build Root Web
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/**') != '' }}

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload root web artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-web-files
          path: web

  deploy:
    name: Deploy Artifacts
    runs-on: ubuntu-latest
    needs:
      - build-flutter-web
      - build-root-web
    if: ${{ always() && needs.build-flutter-web.result == 'success' }}

    steps:
      - name: Download Flutter web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: deploy/flutter

      - name: Download root web artifact
        if: ${{ needs.build-root-web.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: root-web-files
          path: deploy/root-web

      - name: Show deployed files
        run: |
          echo "Flutter web files:"
          find deploy/flutter -maxdepth 3 -type f | sort || true
          echo
          echo "Root web files:"
          find deploy/root-web -maxdepth 3 -type f | sort || true

      - name: Deployment placeholder
        run: |
          echo "Add your real deployment command here."
          echo "Examples:"
          echo "- aws s3 sync deploy/flutter s3://your-bucket/"
          echo "- rsync/scp to server"
          echo "- upload to Cloudflare Pages / Firebase Hosting / Netlify"
