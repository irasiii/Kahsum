name: Deploy Static Sites

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-flutter-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Flutter platforms exist
        run: |
          flutter config --enable-web
          flutter create --platforms=web,android .

      - name: Patch Android Gradle Kotlin DSL SDK values
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter\.compileSdkVersion/36/g' android/app/build.gradle.kts
            sed -i 's/flutter\.minSdkVersion/21/g' android/app/build.gradle.kts
            sed -i 's/flutter\.targetSdkVersion/36/g' android/app/build.gradle.kts
            echo "Patched android/app/build.gradle.kts"
            echo "-----"
            grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle.kts || true
            echo "-----"
          else
            echo "android/app/build.gradle.kts not found, skipping patch"
          fi

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: apps/flutter_app/build/web

  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore original pubspec.yaml
        run: git checkout -- pubspec.yaml
      - name: Regenerate Android platform files
        run: |
          rm -rf android/
          flutter create --platforms android .
          git checkout -- pubspec.yaml lib/
      - name: Ensure asset directories exist
        run: mkdir -p assets/images assets/icons
      - name: Install Android SDK platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-36" 2>/dev/null || true
      - name: Patch Android Gradle SDK values
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter\.compileSdkVersion/36/g' android/app/build.gradle.kts
            sed -i 's/flutter\.minSdkVersion/21/g' android/app/build.gradle.kts
            sed -i 's/flutter\.targetSdkVersion/36/g' android/app/build.gradle.kts
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Install dependencies
        run: flutter pub get
      - name: Fix compileSdk in app + all plugin modules
        run: |
          sed -i 's/flutter\.compileSdkVersion/36/g' android/app/build.gradle.kts
          find ~/.pub-cache -name "build.gradle*" -path "*/android/*" -type f 2>/dev/null | while read f; do
            sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/compileSdk = 36/g' "$f"
            sed -i 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9][0-9]*/compileSdkVersion = 36/g' "$f"
          done
      - name: Clean + Build APK
        run: |
          flutter clean
          flutter pub get
          set +e
          flutter build apk --release > build.log 2>&1
          exit_code=$?
          echo "Exit code: $exit_code"
          if [ $exit_code -ne 0 ]; then
            echo "### Build failed - full log:" >> $GITHUB_STEP_SUMMARY
            cat build.log >> $GITHUB_STEP_SUMMARY
          fi
          exit $exit_code
        shell: bash
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khasm-apk-build-log
          path: apps/flutter_app/build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khasm-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Deploy to S3/CloudFront
    runs-on: ubuntu-latest
    needs:
      - build-flutter-web
    if: ${{ always() && needs.build-flutter-web.result == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Flutter web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync deploy/ s3://khasm-${ENVIRONMENT:-staging}-flutter-web --delete

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, 'khasm-${ENVIRONMENT:-staging}-flutter-web')].Id" --output text)
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi
