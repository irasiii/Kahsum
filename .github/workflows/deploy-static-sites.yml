name: Deploy Static Sites

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "apps/flutter_app/**"
      - ".github/workflows/deploy-static-sites.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  deploy-nextjs:
    name: Build & Deploy Next.js Site
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.khasm-${ENVIRONMENT}.example.com

      - name: Deploy to S3
        run: aws s3 sync out/ s3://khasm-${ENVIRONMENT}-nextjs --delete

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, 'khasm-${ENVIRONMENT}-nextjs')].Id" --output text)
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi

  deploy-flutter:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Restore original pubspec.yaml
        run: git checkout -- pubspec.yaml

      - name: Enable web platform
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to S3
        run: aws s3 sync build/web/ s3://khasm-${ENVIRONMENT}-flutter-web --delete

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, 'khasm-${ENVIRONMENT}-flutter-web')].Id" --output text)
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi

  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Restore original pubspec.yaml
        run: git checkout -- pubspec.yaml

      - name: Regenerate Android platform files
        run: |
          rm -rf android/
          flutter create --platforms android .
          git checkout -- pubspec.yaml lib/

      - name: Ensure asset directories exist
        run: mkdir -p assets/images assets/icons

      - name: Install Android SDK platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-35" 2>/dev/null || true

      - name: Fix compileSdk/minSdk/targetSdk in generated build.gradle.kts
        run: |
          printf 'plugins {\n    id("com.android.application")\n    id("org.jetbrains.kotlin.android")\n    id("dev.flutter.flutter-gradle-plugin")\n}\n\nandroid {\n    namespace = "com.khasm.app"\n    compileSdk = 35\n\n    defaultConfig {\n        applicationId = "com.khasm.app"\n        minSdk = 21\n        targetSdk = 35\n        versionCode = 1\n        versionName = "1.0"\n    }\n\n    buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("debug")\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n\nflutter {\n    source = "../.."\n}\n' > android/app/build.gradle.kts
          echo "=== Verified ==="
          grep -n "compileSdk\|minSdk\|targetSdk" android/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          exit_code=$?
          echo "Exit code: $exit_code"
          if [ $exit_code -ne 0 ]; then
            echo "### Build failed - full log:" >> $GITHUB_STEP_SUMMARY
            cat build.log >> $GITHUB_STEP_SUMMARY
          fi
          exit $exit_code
        shell: bash

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khasm-apk-build-log
          path: apps/flutter_app/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khasm-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
