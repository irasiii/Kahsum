name: khasm
description: Khasm - B2C discount marketplace for KSA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  easy_localization: ^3.0.3
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  intl_phone_number_input: ^0.7.5
  firebase_messaging: ^14.7.15
  firebase_core: ^2.25.4
  hijri: ^3.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  flutter_rating_bar: ^4.0.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/images/
    - assets/icons/
