services:
  postgres:
    image: postgres:16-alpine
    container_name: khasm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: khasm
      POSTGRES_PASSWORD: khasm
      POSTGRES_DB: khasmdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
